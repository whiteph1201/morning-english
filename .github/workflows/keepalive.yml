# Supabase 무료 프로젝트는 오래 안 쓰면 잠들 수 있어서, 매주 한 번 깨워 둠
name: 3. Supabase 깨워 두기
on:
  schedule:
    - cron: '17 1 * * 1'   # 매주 월요일
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/supabase_sync.py ping
